<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bedazzled – Test-Simulator (3D-Brett)</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="style.css" />
<style>
  body { padding: 0; }
  #sim-toolbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--night-2);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  #sim-toolbar h1 { font-size: 18px; margin: 0; font-family: var(--font-display); }
  #sim-toolbar .slot-buttons { display: flex; gap: 6px; }
  #sim-toolbar button {
    padding: 8px 14px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.14);
    background: transparent; color: var(--ink-dim); font-weight: 700; cursor: pointer; font-size: 13px;
  }
  #sim-toolbar button.active { border-color: var(--gold); color: var(--gold); background: rgba(242,183,5,0.08); }
  #sim-toolbar .hint-inline { font-size: 12px; color: var(--ink-dim); }
  #sim-grid {
    display: grid;
    gap: 10px;
    padding: 10px;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  }
  .sim-panel {
    background: var(--night-2);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; flex-direction: column;
  }
  .sim-panel-label {
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-dim);
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .sim-panel iframe {
    width: 100%;
    height: 780px;
    border: none;
    background: var(--night);
  }
  #sim-reset {
    margin-left: auto;
  }
</style>
</head>
<body>

<div id="sim-toolbar">
  <h1>🧪 Test-Simulator (3D-Brett)</h1>
  <div class="slot-buttons" id="slot-buttons"></div>
  <span class="hint-inline">Jedes Fenster ist ein unabhängiger Mitspieler. Raum in Fenster 1 erstellen, Code dann in den anderen Fenstern beitreten.</span>
  <button id="sim-close-lobby">🏠 Lobby schließen (Startseite)</button>
  <button id="sim-auto-setup">⚡ Testrunde automatisch einrichten</button>
  <button id="sim-reset">🔄 Alle zurücksetzen</button>
</div>

<div id="sim-grid"></div>

<script>
  let playerCount = 3;

  function renderButtons() {
    const box = document.getElementById('slot-buttons');
    box.innerHTML = '';
    [3, 4, 5, 6].forEach(n => {
      const btn = document.createElement('button');
      btn.textContent = n + ' Spieler';
      btn.className = n === playerCount ? 'active' : '';
      btn.addEventListener('click', () => { playerCount = n; renderButtons(); renderGrid(); });
      box.appendChild(btn);
    });
  }

  function renderGrid() {
    const grid = document.getElementById('sim-grid');
    grid.innerHTML = '';
    for (let i = 1; i <= playerCount; i++) {
      const panel = document.createElement('div');
      panel.className = 'sim-panel';
      panel.innerHTML = `
        <div class="sim-panel-label">Spieler-Fenster ${i}</div>
        <iframe src="index-3d.html?testSlot=${i}"></iframe>
      `;
      grid.appendChild(panel);
    }
  }

  // WICHTIGER BUGFIX: die echten Sitzungsdaten (Token/Raum) liegen in localStorage, nicht in
  // sessionStorage - hier wurde bisher die falsche Speicherart geleert, weshalb nach einem
  // "Zurücksetzen" trotzdem wieder alle im selben Raum/Stand landeten.
  function clearAllSimSessions() {
    for (let i = 1; i <= 6; i++) {
      localStorage.removeItem('bedazzled3d_token_slot' + i);
      localStorage.removeItem('bedazzled3d_room_slot' + i);
    }
  }

  document.getElementById('sim-reset').addEventListener('click', () => {
    if (!confirm('Alle simulierten Spieler zurücksetzen? (lädt alle Fenster neu, Sitzungen gehen verloren)')) return;
    clearAllSimSessions();
    renderGrid();
  });

  // Bringt wirklich ALLE Fenster auf die Startseite, bevor irgendein Raum geöffnet ist -
  // z.B. um den allerersten Moment (vor Rundenstart 1) erneut zu testen, ohne jeden
  // einzelnen simulierten Spieler manuell aus dem Raum verlassen zu müssen.
  document.getElementById('sim-close-lobby').addEventListener('click', () => {
    if (!confirm('Aktuelle Lobby/Raum für ALLE simulierten Spieler komplett schließen und auf die Startseite zurück? Der Fortschritt geht verloren.')) return;
    clearAllSimSessions();
    renderGrid();
  });

  // ---------- "Testrunde automatisch einrichten" ----------
  // Erspart beim Testen das manuelle Durchklicken: Raum erstellen, alle anderen Fenster
  // beitreten lassen (Name + Spielfigur sind für Test-Slots ohnehin schon automatisch
  // vorbelegt, siehe client-3d.js), warten bis alle da sind, dann direkt die erste Runde
  // starten.
  function waitFor(conditionFn, timeoutMs, intervalMs = 150) {
    return new Promise((resolve) => {
      const start = Date.now();
      (function poll() {
        let ok = false;
        try { ok = !!conditionFn(); } catch (e) { ok = false; }
        if (ok) return resolve(true);
        if (Date.now() - start >= timeoutMs) return resolve(false);
        setTimeout(poll, intervalMs);
      })();
    });
  }
  function waitForIframeLoaded(iframe) {
    return new Promise((resolve) => {
      if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') return resolve();
      iframe.addEventListener('load', () => resolve(), { once: true });
    });
  }

  const autoSetupBtn = document.getElementById('sim-auto-setup');
  autoSetupBtn.addEventListener('click', async () => {
    if (!confirm(`Testrunde mit ${playerCount} Spielern automatisch einrichten? Alle Fenster werden auf die Startseite zurückgesetzt und neu befüllt.`)) return;
    autoSetupBtn.disabled = true;
    const originalLabel = autoSetupBtn.textContent;
    autoSetupBtn.textContent = '⏳ Wird eingerichtet …';
    try {
      clearAllSimSessions();
      renderGrid();

      const iframes = Array.from(document.querySelectorAll('.sim-panel iframe'));
      await Promise.all(iframes.map(waitForIframeLoaded));
      // Kleiner Puffer: die Seite muss ihr eigenes Setup (Socket-Verbindung, Vorbelegung von
      // Name/Spielfigur für den Test-Slot) noch synchron abschließen können.
      await new Promise(r => setTimeout(r, 400));

      // WICHTIG: der direkte "Raum erstellen"-Weg hat sich als nicht zuverlässig automatisierbar
      // erwiesen - stattdessen wird hier exakt der vom Nutzer bestätigte, manuell funktionierende
      // Weg über "🎲 Multiplayer (zufällige Lobby)" nachgebaut: jedes Fenster tritt derselben
      // Größen-Warteschlange bei (4er- oder 6er-Lobby, je nach gewählter Spieleranzahl), sobald
      // genug Fenster beigetreten sind, entsteht automatisch eine gemeinsame Lobby.
      const mpSize = playerCount <= 4 ? 4 : 6;
      iframes.forEach((iframe) => {
        const doc = iframe.contentDocument;
        doc.getElementById('btn-multiplayer-toggle').click();
        doc.getElementById(mpSize === 4 ? 'btn-mp-size-4' : 'btn-mp-size-6').click();
        doc.getElementById('btn-confirm-setup').click();
      });

      // Warten, bis aus der Warteschlange eine gemeinsame Lobby mit allen Testspielern
      // entstanden ist (bei einer Spieleranzahl, die nicht exakt 4 oder 6 ist, dauert das
      // ggf. länger, da erst der Matchmaking-Countdown ablaufen muss).
      const refWin = iframes[0].contentWindow;
      const gotLobby = await waitFor(
        () => refWin.__bedazzledTest
          && refWin.__bedazzledTest.getPhase() === 'lobby'
          && refWin.__bedazzledTest.getPlayerCount() >= playerCount,
        25000
      );
      if (!gotLobby) throw new Error('Es ist keine gemeinsame Lobby mit allen Testspielern zustande gekommen.');

      // Kurzer Puffer, damit der Lobby-State (inkl. Avatar-Auswahl-UI) in jedem Fenster
      // sicher gerendert wurde, bevor Spielfiguren ausgewählt werden.
      await new Promise(r => setTimeout(r, 400));

      // Spielfiguren nacheinander (nicht parallel!) auswählen lassen, damit sich zwei
      // Fenster nicht versehentlich dieselbe Figur gleichzeitig schnappen.
      for (const iframe of iframes) {
        const doc = iframe.contentDocument;
        const freeOption = Array.from(doc.querySelectorAll('#avatar-picker .avatar-option'))
          .find(el => !el.classList.contains('taken'));
        if (freeOption) freeOption.click();
        await new Promise(r => setTimeout(r, 300));
      }

      const allHaveAvatars = await waitFor(
        () => refWin.__bedazzledTest && refWin.__bedazzledTest.getAllHaveAvatars(),
        8000
      );
      if (!allHaveAvatars) throw new Error('Nicht alle Testspieler haben rechtzeitig eine Spielfigur bekommen.');

      await new Promise(r => setTimeout(r, 300));

      // Auf alle Fenster klicken (nur beim tatsächlichen Host/Moderator hat das einen
      // Effekt - der Server weist den Klick von allen anderen zurück).
      iframes.forEach((iframe) => {
        const btn = iframe.contentDocument.getElementById('btn-start-round');
        if (btn) btn.click();
      });
    } catch (err) {
      alert('Automatisches Einrichten ist fehlgeschlagen: ' + err.message + '\nBitte den Rest manuell fertig einrichten.');
    } finally {
      autoSetupBtn.disabled = false;
      autoSetupBtn.textContent = originalLabel;
    }
  });

  renderButtons();
  renderGrid();
</script>
</body>
</html>
